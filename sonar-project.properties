sonar.projectKey=Taxflow-scan
sonar.projectName=Taxflow Scan
sonar.sourceEncoding=UTF-8

# โค้ดที่ส่งขึ้นระบบจริง: API, หน้าเว็บ, กติกาภาษีที่ใช้ร่วมกัน และสคริปต์ดูแลระบบ
sonar.sources=apps/api,apps/web/src,apps/web/vite.config.js,packages/shared,scripts
# ไฟล์ทดสอบนับเป็น "test" (ไม่นับเป็นโค้ดที่ต้องมี coverage หรือนับโค้ดซ้ำ)
sonar.tests=apps/api/test,apps/web/src
sonar.test.inclusions=apps/api/test/**,apps/web/src/**/*.test.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-status/**,**/coverage/**,apps/api/test/**,**/*.test.js,\
  apps/api/data/**,apps/api/backups/**,apps/api/out/**,apps/api/assets/**

# coverage จาก npm run coverage (รวม API + หน้าเว็บ เป็น path สัมพัทธ์จากรากโปรเจกต์)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# ไม่นับ coverage ของ:
#   - หน้าจอ React (.jsx) ทดสอบด้วยการเปิดใช้งานจริง/ภาพหน้าจอ ไม่มีชุดทดสอบ DOM
#   - โมดูลที่ทำงานได้เฉพาะในเบราว์เซอร์ (React hooks, OCR/PDF worker, popup Google, ธีม/การแสดงผล)
#   - สคริปต์ดูแลระบบที่รันมือครั้งคราว (ย้ายฐานข้อมูล, seed, แคปหน้าจอ) และ config ของ build
sonar.coverage.exclusions=apps/web/src/**/*.jsx,apps/web/src/**/use*.js,apps/web/vite.config.js,\
  apps/web/src/lib/theme.js,apps/web/src/lib/appearance.js,apps/web/src/lib/docFonts.js,\
  apps/web/src/features/auth/googlePopup.js,apps/web/src/features/wht/ocr.js,apps/web/src/features/wht/pdfText.js,\
  apps/web/src/features/wht/readDocument.js,apps/web/src/features/wht/unzip.js,\
  apps/api/scripts/**,scripts/**

sonar.javascript.node.maxspace=6144
