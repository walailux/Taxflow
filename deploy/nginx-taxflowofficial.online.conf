# nginx ของเครื่องเซิร์ฟเวอร์ (ไม่ใช่ในคอนเทนเนอร์) สำหรับ taxflowofficial.online
# วางที่ /etc/nginx/sites-available/ แล้ว ln -s ไปที่ sites-enabled จากนั้นรัน
#   certbot --nginx -d taxflowofficial.online -d www.taxflowofficial.online
# certbot จะเพิ่มส่วน listen 443 ssl และ redirect จาก http ให้เอง
# ไม่แตะ server block ของเว็บอื่นในเครื่อง (เช่น influenzaofficial.tech)

server {
  listen 80;
  listen [::]:80;
  server_name taxflowofficial.online www.taxflowofficial.online;

  # ไฟล์แนบส่งเป็น base64 ใน JSON สูงสุดราว 7 MB ให้เท่ากับ nginx ในคอนเทนเนอร์ web
  client_max_body_size 12m;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    # API เทียบ Host กับ Origin เพื่อกัน CSRF ต้องส่ง Host เดิมของเบราว์เซอร์ต่อไป
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # สร้าง PDF พร้อมลงลายมือชื่อดิจิทัลใช้เวลาได้หลายวินาที
    proxy_read_timeout 120s;
  }
}
