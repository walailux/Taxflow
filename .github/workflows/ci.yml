# CI: ทุก push และ pull request รันชุดทดสอบทั้งสองฝั่ง แล้วลอง build image ทั้งสองตัว
# ไม่ต้องตั้ง secret ใด ๆ
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ชุดทดสอบ API (node --test) ใช้ SQLite ชั่วคราว ไม่ต้องต่อฐานข้อมูลจริง
      - run: npm test
      - run: npm run test:web
      - run: npm run build:web

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
