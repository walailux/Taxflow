# Deploy: เมื่อ CI ของ main ผ่าน (หรือกด Run workflow เอง)
#   1) build-push  build image api + web แล้ว push ขึ้น GHCR (tag latest และ sha-xxxxxxx)
#   2) deploy      SSH เข้า VPS ดึง image ใหม่แล้วรันต่อ จากนั้นเช็ก /api/health ผ่านโดเมนจริง
#
# ตั้งค่าที่ Settings → Secrets and variables → Actions
#   Secrets:   VPS_SSH_KEY (private key ของ deploy)  VPS_HOST (IP ของ VPS)  VPS_USER (deploy)
#   Variables: APP_URL (https://taxflowofficial.online)
# ถ้ายังไม่ได้ตั้ง APP_URL job deploy จะเป็น skipped (build-push ยังทำงาน)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run ต้อง build commit เดียวกับที่ CI ทดสอบผ่าน ไม่ใช่ commit ล่าสุดของ branch
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taxflow" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-api:latest
            ${{ steps.meta.outputs.prefix }}-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-web:latest
            ${{ steps.meta.outputs.prefix }}-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-push
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: ssh key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: pull + up บน VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd ~/taxflow && export TAG=$TAG && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
      - name: เช็ก /api/health ผ่านโดเมนจริง
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$APP_URL/api/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "เว็บไม่ตอบ /api/health ภายใน 2 นาที" >&2
          exit 1
