# เสิร์ฟหน้าเว็บที่ build แล้ว และส่งต่อ /api ไปยังคอนเทนเนอร์ api
# ใช้โดเมนเดียวกันทั้งหน้าเว็บและ API เหมือนตอนพัฒนา (proxy ของ Vite) คุกกี้ session
# จึงเป็น first-party ตามปกติ และ Origin ที่ API เห็นตรงกับ WEB_ORIGINS
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ปิดการประกาศเวอร์ชัน nginx ในส่วนหัวตอบกลับ
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # API ตรวจ Origin เพื่อกัน CSRF ต้องส่งต่อของจริงไป ไม่ให้ nginx เขียนทับ
    proxy_set_header Origin $http_origin;
    # ไฟล์แนบสูงสุด 5 MB แต่ส่งเป็น base64 ใน JSON จึงบวมขึ้นราว 1.37 เท่า เผื่อไว้ 12 MB
    client_max_body_size 12m;
    # สร้าง PDF/A-3 พร้อมลงลายมือชื่อดิจิทัลใช้เวลาได้หลายวินาทีในเอกสารหลายหน้า
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  # ไฟล์ที่มีลายนิ้วมือในชื่อ (index-ab12cd34.js) เปลี่ยนชื่อทุกครั้งที่ build จึง cache ยาวได้
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # mime.types ของ nginx ไม่รู้จัก .mjs จึงส่งเป็น application/octet-stream เบราว์เซอร์ไม่ยอมโหลดเป็น module
  # worker ของ pdf.js (pdf.worker.min-*.mjs) โหลดไม่ขึ้น ตัวอย่างเอกสารในหน้าเอกสารและกล่องรับเอกสารจึงแสดงไม่ได้
  location ~* ^/assets/.+\.mjs$ {
    types { }
    default_type text/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: เส้นทางฝั่ง React (/app/docs ฯลฯ) ไม่มีไฟล์จริง ต้องคืน index.html ให้ router จัดการเอง
  location / {
    try_files $uri $uri/ /index.html;
  }
}
